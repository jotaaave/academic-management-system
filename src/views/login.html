<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGA - Login do Docente</title>
  <link rel="stylesheet" href="../styles/login.css" />
</head>
<body>
  <main class="page">
    <aside class="brand">
      <div class="brand__top">
        <h1 class="brand__title">SGA</h1>
        <p class="brand__subtitle">
          Sistema de Gestao<br />
          Academica &nbsp;-&nbsp; Area do Docente
        </p>
      </div>

      <span class="circle circle--left" aria-hidden="true"></span>
      <span class="circle circle--mid" aria-hidden="true"></span>
      <span class="circle circle--big" aria-hidden="true"></span>

      <p class="brand__tagline">
        Acompanhe turmas,<br />
        lance notas e gere boletins<br />
        em um so lugar.
      </p>
    </aside>

    <section class="content">
      <div class="card">
        <h2 class="card__title">Bem-vindo de volta</h2>
        <p class="card__subtitle">Entre com suas credenciais institucionais</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">E-mail institucional</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="professor@maisunifacisa.com.br"
              autocomplete="username"
            />
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <div class="input-group">
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="toggle" id="toggle-senha" aria-label="Mostrar senha" aria-pressed="false">
  <svg class="icon icon--show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
  <svg class="icon icon--hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
  </svg>
</button>
            </div>
          </div>

          <a href="#" class="forgot" id="forgot">Esqueci minha senha</a>

          <p class="error" id="error" role="alert" hidden></p>

          <button type="submit" class="btn">Entrar</button>
        </form>

        <div class="card__footer">
          <p>Ainda nao tem uma conta?</p>
          <a href="./cadastro.html" id="register">Cadastre-se como professor</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../scripts/back-end.js"></script>
  <script src="../scripts/login.js"></script>
</body>
</html>
