<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/home.css">
    <title>SGA HOME</title>
</head>
<body>
    <aside class="menu-lateral">
        <div class="logo">
            <div class="logo-circulo">F</div>
            <div>
                <strong>SGA</strong>
                <span>Documento</span>
            </div>
        </div>

        <nav class="menu">
            <a href="#" class="menu-item ativo">
                <span class="bolinha"></span>
                Minhas turmas
            </a>

            <a href="./perfil.html" class="menu-item">
                <span class="bolinha"></span>
                Meu perfil
            </a>

            <a href="#" class="menu-item sair" id="sair">
                <span class="bolinha"></span>
                Sair
            </a>
        </nav>

        <div class="professor">
            <div class="professor-circulo" id="iniciaisProfessor">P</div>

            <div>
                <strong id="nomeProfessor">Professor</strong>
                <span>Professor(a)</span>
            </div>
        </div>
    </aside>

    <main class="conteudo">
        <header class="cabecalho">
            <div>
                <h1>Minhas turmas</h1>
                <p>Selecione uma turma para abrir o diário de notas</p>
            </div>

            <div class="usuario" id="iniciaisTopo">P</div>
        </header>

        <div class="acoes-topo">
            <button class="adicionar-turma" type="button">Adicionar turma</button>
        </div>

        <section class="turmas" aria-label="Lista de turmas"></section>

        <section class="estado-vazio" id="estadoVazio" hidden>
            <h2>Nenhuma turma cadastrada</h2>
            <p>Quando houver turmas salvas, elas aparecerão aqui.</p>
        </section>
    </main>

    <script src="../scripts/back-end.js"></script>
    <script src="../scripts/home.js"></script>
</body>
</html>
